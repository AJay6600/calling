name: PR Title & Quality Checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-pr:
    name: PR Title & Conventional Commits Check
    runs-on: ubuntu-latest

    steps:
      - name: Validate PR Title Format
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const title = pr.title;

            // Standard conventional commit prefixes
            const conventionalCommitRegex = /^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?: .+/i;

            const isValid = conventionalCommitRegex.test(title);

            if (!isValid) {
              console.log(`PR Title "${title}" does not follow Conventional Commits standard.`);
            } else {
              console.log(`PR Title "${title}" is valid!`);
            }
