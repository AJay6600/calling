name: CI & Code Verification

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

permissions:
  contents: read
  pull-requests: write

jobs:
  lint-and-build:
    name: Lint & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Generate Prisma Client
        run: yarn nx run lib-prisma:generate

      - name: Run Linting
        run: npx nx run-many -t lint

      - name: Build Projects
        run: npx nx run-many -t build

  pr-comment:
    name: Post PR Verification Status
    needs: lint-and-build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Comment PR Verification Status
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.issue.number;
            const repo = context.repo;

            const body = `### 🚀 Automated CI & Verification Report

            | Check | Status | Details |
            | :--- | :---: | :--- |
            | **Code Linting** | ✅ Passed | Clean ESLint & static checks across all workspace apps/libs |
            | **Prisma Schema** | ✅ Generated | Prisma client generated successfully |
            | **TypeScript Build** | ✅ Passed | All projects compiled with zero build errors |

            ---

            #### 📦 Verified Workspace Projects
            - \`apps/web\` (React 19 + Vite + AntD)
            - \`apps/api\` (NestJS Backend API)
            - \`libs/prisma\` (Prisma ORM & Schema)
            - \`libs/types\` (Shared Domain Types & DTOs)

            > *This comment was automatically generated by GitHub Actions CI.*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: repo.owner,
              repo: repo.repo,
              issue_number: prNumber,
            });

            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('Automated CI & Verification Report')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: repo.owner,
                repo: repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: repo.owner,
                repo: repo.repo,
                issue_number: prNumber,
                body: body
              });
            }
