table:
  name: agents
  schema: public
object_relationships:
  - name: agent_language_enum
    using:
      foreign_key_constraint_on: language_id
  - name: organization
    using:
      foreign_key_constraint_on: organization_id
select_permissions:
  - role: anonymous
    permission:
      columns:
        - bolna_agent_id
        - name
        - zitadel_org_id
        - language_id
        - created_at
        - updated_at
        - id
        - organization_id
      filter:
        zitadel_org_id:
          _eq: x-hasura-zitadel-org-id
    comment: ""
